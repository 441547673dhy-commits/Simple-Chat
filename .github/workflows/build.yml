name: build
on: workflow_dispatch
jobs:
  b:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /opt/android-sdk
      ANDROID_HOME: /opt/android-sdk
      ANDROID_USER_HOME: /home/runner/.android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: |
          sudo mkdir -p /opt/android-sdk/cmdline-tools
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/c.zip
          sudo unzip -qo /tmp/c.zip -d /opt/android-sdk/cmdline-tools
          sudo mv /opt/android-sdk/cmdline-tools/cmdline-tools /opt/android-sdk/cmdline-tools/latest
          yes | sudo /opt/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
          sudo /opt/android-sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
          sudo ln -sfn /opt/android-sdk/platforms/android-37.0 /opt/android-sdk/platforms/android-37
      - run: |
          mkdir -p $ANDROID_USER_HOME
          # 固定签名：每次构建用同一个密钥，否则每个包都是"新应用"，覆盖安装必然签名冲突
          echo "$KEYSTORE_B64" | base64 -d > $ANDROID_USER_HOME/debug.keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
      - run: |
          echo "keystore 指纹："
          keytool -list -keystore $ANDROID_USER_HOME/debug.keystore -storepass android | grep -i SHA
      - run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon > /tmp/b.log 2>&1 || {
            echo "===== Kotlin 错误 ====="
            grep -E '^e: |error:' /tmp/b.log | head -40
            echo "===== 任务失败摘要 ====="
            grep -A8 'What went wrong' /tmp/b.log | head -12
            echo "::error::$(grep -A8 'What went wrong' /tmp/b.log | tr '\n' ' ' | cut -c1-800)"
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app/build/outputs/apk/debug/*.apk
